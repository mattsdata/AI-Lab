[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailab-mental-health"
version = "1.0.0"
description = "Private, safety-first, non-diagnostic wellbeing tools: PHQ-9 and GAD-7 scoring, crisis resources, encrypted journal, gentle summaries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mathew Varghese" }]
keywords = ["mental-health", "wellbeing", "phq-9", "gad-7", "privacy"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "numpy>=1.24",
  "mattslib @ git+https://github.com/mattsdata/mattslib.git",
]

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "cryptography>=42"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ailab_mental_health"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"


[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --cov=ailab_mental_health --cov-report=term-missing --cov-fail-under=90"
