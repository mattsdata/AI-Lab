[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailab-finance"
version = "1.2.0"
description = "Market analytics and a corporate early warning system (equity outlook + credit risk). Research use only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mathew Varghese", email = "removed@example.invalid" }]
keywords = ["finance", "credit-risk", "merton", "risk-metrics", "early-warning"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "numpy>=1.24",
  "mattslib @ git+https://github.com/mattsdata/mattslib.git",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
news = ["ailab-nlp @ git+https://github.com/mattsdata/ai-lab.git#subdirectory=packages/nlp"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ailab_finance"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --cov=ailab_finance --cov-report=term-missing --cov-fail-under=90"
