[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailab-heritage"
version = "1.0.0"
description = "Landscape archaeology from elevation data: candidate earthworks, evidence-based status, site protection and landscape change over centuries."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mathew Varghese", email = "removed@example.invalid" }]
keywords = ["archaeology", "lidar", "dem", "heritage", "remote-sensing"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "numpy>=1.24",
  "mattslib @ git+https://github.com/mattsdata/mattslib.git",
  "ailab-geo @ git+https://github.com/mattsdata/ai-lab.git#subdirectory=packages/geo",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ailab_heritage"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"


[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --cov=ailab_heritage --cov-report=term-missing --cov-fail-under=90"
