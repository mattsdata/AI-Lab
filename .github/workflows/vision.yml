name: vision

on:
  push:
    branches: [main]
    paths: ["packages/vision/**", ".github/workflows/vision.yml"]
  pull_request:
    paths: ["packages/vision/**", ".github/workflows/vision.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vision
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
