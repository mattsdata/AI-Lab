name: architecture

# Enforces ADR-0001: packages never import frameworks; frameworks stay independent.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  import-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages and frameworks
        # --no-deps: import-linter only reads the source; local packages must not clash with
        # the same packages referenced by Git URL in framework dependencies.
        run: |
          pip install import-linter
          pip install --no-deps -e packages/vision -e packages/nlp -e packages/ml -e packages/timeseries -e frameworks/finance -e frameworks/climate -e frameworks/mental-health
      - name: Check import contracts
        run: lint-imports
