[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailab-geo"
version = "1.0.0"
description = "Terrain analysis, landform change (hillslope diffusion) and region shape measurement on georeferenced rasters. NumPy only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mathew Varghese", email = "removed@example.invalid" }]
keywords = ["gis", "terrain", "dem", "lidar", "geomorphology"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ailab_geo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --cov=ailab_geo --cov-report=term-missing --cov-fail-under=90"
