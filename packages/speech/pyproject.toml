[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailab-speech"
version = "1.0.0"
description = "Pluggable speech-to-text and text-to-speech engines (Whisper, gTTS) with word error rate, subtitles and TTS chunking."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mathew Varghese" }]
keywords = ["speech", "asr", "tts", "whisper", "voice"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
dependencies = [
  "mattslib @ git+https://github.com/mattsdata/mattslib.git",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
gtts = ["gTTS>=2.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ailab_speech"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "gtts", "gtts.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --cov=ailab_speech --cov-report=term-missing --cov-fail-under=90"
